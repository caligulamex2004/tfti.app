name: tftiapp
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_messaging: ^16.1.0
  url_launcher: ^6.3.2
  http: ^1.2.0
  uuid: ^4.3.3
  material_symbols_icons: ^4.2892.0
  flutter_contacts: ^1.1.9+2
  shared_preferences: ^2.5.4
  intl_phone_field: ^3.2.0
  purchases_flutter: ^9.13.2
  firebase_storage: ^13.1.0
  image_picker: ^1.2.1
  flutter_image_compress: ^2.4.0
  any_link_preview: ^3.0.3
  cached_network_image: ^3.4.1
  emoji_picker_flutter: ^4.4.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  add_2_calendar: ^3.0.1
  flutter_app_badger: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.3.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/icon_bg.png" 
  adaptive_icon_foreground: "assets/icon/android_icon.png" 

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_native_splash:
  color: "#1D73CB" 
  android_12:
    color: "#1D73CB"